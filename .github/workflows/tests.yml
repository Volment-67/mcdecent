name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests (offline)
        # GUI 测试需要桌面/Tk 环境，在本地运行；CI 只跑无界面的核心测试
        run: python -m pytest -q -m "not network" --ignore=tests/test_gui.py
        env:
          MCDECENT_HOME: /tmp/mcdecent-ci
